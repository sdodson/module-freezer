apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: module-freezer-scc
  labels:
    app: module-freezer
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["module-freezer"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: module-freezer-scc
  labels:
    app: module-freezer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: module-freezer-scc
subjects:
  - kind: ServiceAccount
    name: module-freezer
    namespace: openshift-module-freezer
